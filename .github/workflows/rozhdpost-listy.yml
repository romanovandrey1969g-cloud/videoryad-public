name: rozhdpost-listy
# Контактные листы ролика «Рождественский пост» — декорации и готовые кадры.
# Считает РАННЕР, а не его машина (правило 23.10). Запуск только вручную.
on:
  workflow_dispatch:
    inputs:
      chto:
        description: 'dek (декорации) | kadry (готовые кадры) | oba'
        required: false
        default: 'dek'
jobs:
  listy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet cairosvg pillow
      - name: листы
        working-directory: rozhdpost
        run: |
          CH="${{ github.event.inputs.chto }}"; CH="${CH:-dek}"
          FL=""
          [ "$CH" = "dek" ] && FL="--dek"
          [ "$CH" = "kadry" ] && FL="--kadry"
          [ "$CH" = "oba" ] && FL="--dek --kadry"
          python3 listy_vse.py "$GITHUB_WORKSPACE/listy" $FL
          ls -la "$GITHUB_WORKSPACE/listy"
      - uses: actions/upload-artifact@v4
        with:
          name: rozhdpost-listy
          path: listy/*.jpg
          retention-days: 2
